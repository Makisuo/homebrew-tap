name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Test ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    env:
      HOMEBREW_NO_SANDBOX_LINUX: 1
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-14
          # Covers the on_intel path, which the formula only started serving at
          # v0.0.22 — upstream published no Intel bundle until macos-15-intel
          # replaced the retired macos-13 label. Scarce runners: this job can
          # queue far longer than the others, and fail-fast is already off.
          - macos-15-intel
          - ubuntu-22.04
          - ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v6

      - uses: Homebrew/actions/setup-homebrew@main

      - name: Audit formula
        run: brew audit --formula maple

      - name: Install formula
        run: brew install maple

      - name: Test formula
        run: brew test maple
